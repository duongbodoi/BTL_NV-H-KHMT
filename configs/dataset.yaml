# Phạm vi dữ liệu (spec mục 3, 7). Giá trị `null`/[] = nhóm chưa chốt (spec mục 21.1).
industry: steel

# Danh sách mã công ty thép niêm yết — DO NHÓM CHỐT, không đặt trong code.
companies: [HPG, HSG, NKG]

# Dữ liệu là BCTC NĂM (không phải quý), nguồn chính là OCR ViFinQA; không có nguồn có cấu trúc.
# Công ty có năm tài chính lệch lịch (ví dụ HSG kết thúc 30/9): so sánh nhóm ngành ghép theo năm
# tài chính và gắn cờ khi ngày kết thúc năm tài chính khác nhau (Phase 4/5).
frequency: annual
sources:
  ocr_dir: data/raw/vifinqa   # data/raw/vifinqa/<mã>/<năm>/<tên tài liệu>/..._extracted.txt (không commit)

# Giai đoạn gốc theo báo cáo giữa kỳ (spec mục 3.3).
base_period:
  start_year: 2021
  end_year: 2023

# Cửa sổ chọn ca (nhóm chốt): dữ liệu là BCTC NĂM nên số kỳ ít hơn quý 4 lần; mở rộng số năm để
# giữ cỡ mẫu. Nền lịch sử và peer vẫn dùng mọi năm trước kỳ đang xét (kể cả trước cửa sổ).
# `company_start_year`: công ty có dữ liệu bắt đầu muộn (năm đầu chỉ là số so sánh, chưa có YoY).
case_selection_window:
  start_year: 2016
  end_year: 2023
  company_start_year: {NKG: 2017}

# Dữ liệu từ năm này trở đi CHỈ dùng làm nguồn đáp án tham chiếu,
# không vào kho RAG, không vào input của cấu hình nào (spec mục 3.3, 7.2).
reference_only_from_year: 2024

paths:
  raw: data/raw
  processed: data/processed
  eval: data/eval
  hypotheses: hypotheses

# Số chỉ tiêu đối chiếu ngẫu nhiên với BCTC gốc (spec mục 7.3) — DO NHÓM CHỌN.
reconciliation_sample_n: 20
