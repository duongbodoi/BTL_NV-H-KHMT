# Đánh giá (spec mục 14, 15). Số ca/chia dev-test theo spec; danh sách ca do nhóm chọn.
runs_per_case: 3
target_cases: 11   # spec: 18; nhóm giảm còn 11 (toàn bộ ca vượt ngưỡng), xem DEVIATIONS_FROM_MIDTERM.md
split:
  dev: 4
  test: 7

configs: [A, B, C]
ablations: [no_rag, no_verification, no_library]  # spec mục 14.2; tên tạm, nhóm xác nhận
# Chạy phụ (spec 14.1): A và B nhận cùng danh sách giả thuyết của thư viện thay vì sinh tự do.
secondary_configs: [A_lib, B_lib]

# Câu bắt buộc xuất hiện trong mọi bảng kết quả (spec mục 15).
disclaimer: "Kết quả là khảo sát khả thi, không phải kết luận thống kê (cỡ mẫu nhỏ)."

# Chỉ số thành công — mặc định ở spec mục 15.7; nhóm chốt/đổi TRƯỚC khi chạy test (mục 21.1).
success_criteria: null

freeze_file: configs/eval_freeze.json

# ---- Phase 12a: bộ ca, nhãn, freeze (spec mục 15). Claude chỉ dựng công cụ; nội dung do nhóm làm.
# File do NHÓM điền (mẫu ở data/eval/templates/).
paths:
  cases: data/eval/cases.yaml            # danh sách ca + chia dev/test
  labels_dir: data/eval/labels           # mỗi người gán nhãn một file <tên>.yaml, gán ĐỘC LẬP
  adjudication: data/eval/adjudication.yaml  # người thứ ba giải quyết bất đồng

# Số người gán nhãn độc lập (spec 15.2: hai người; kappa tính giữa hai người này).
annotators: 2
# Mã "ngoài thư viện" trong đáp án và ánh xạ mù (spec 14.1, 15.2).
other_id: other

# Nguồn của nhãn phải ĐỘC LẬP với kho RAG (spec 15.2). Mỗi nguồn: title, date, và url hoặc doc_id.
# Validator (đọc kho từ retrieval.chunks_file): LỖI khi doc_id thuộc kho hoặc nguồn chứa chuỗi
# doc_id của kho; CẢNH BÁO khi nguồn trông như BCTC của công ty + năm đã nạp vào kho (có thể là chính
# tài liệu đó dưới tên/link khác). Nguồn ghi tự do khác validator không kiểm được: người duyệt kiểm.
min_source_title_chars: 8

# Nguyên nhân ca sai (spec 15.5). Người gán; Claude chỉ dựng template và bảng tổng hợp.
failure_causes: [retrieval_miss, rule_wrong, llm_classification_wrong, ambiguous_reference, data_missing]

# Freeze (spec 15.1): băm các file này (đã chuẩn hóa xuống dòng) + dấu vân tay prompt + danh sách ca
# và đáp án cuối. Gồm CODE (luật kiểm chứng, bộ kiểm báo cáo nằm trong src/), dữ liệu đầu vào (giá,
# kho RAG, mốc as-of, ứng viên) và file ca/nhãn. Sửa bất kỳ file nào sau khi đóng băng → runner từ
# chối chạy test trừ khi có --unfreeze-reason (được ghi vào kết quả). OCR thô (data/raw) không băm
# (lớn); nó đi qua rag_chunks.jsonl và anomaly_candidates.csv đã băm.
freeze_globs:
  - "configs/*.yaml"
  - "hypotheses/*.yaml"
  - "HYPOTHESIS_LIBRARY_DRAFT.md"
  - "pyproject.toml"
  - "src/**/*.py"
  - "scripts/*.py"
  - "data/external/*"
  - "data/processed/rag_chunks.jsonl"
  - "data/processed/asof_dates.csv"
  - "data/processed/anomaly_candidates.csv"
  - "data/eval/*.yaml"
  - "data/eval/labels/*.yaml"
# Lý do bỏ qua freeze (--unfreeze-reason) tối thiểu bấy nhiêu ký tự; lý do được ghi vào kết quả.
min_unfreeze_reason_chars: 15

# ---- Phase 12: runner + metric (spec mục 14, 15.3-15.8). Giá trị dưới đây là ĐỀ XUẤT khởi điểm của
# Claude (2026-10-25); nhóm chốt trên tập dev, TRƯỚC khi đóng băng (đổi sau đó làm hash freeze lệch).
runner:
  output_dir: outputs/eval            # kết quả chạy (RunRecord JSON) và bảng; không commit (.gitignore)
  # Thư mục bảng cho NGƯỜI điền (ánh xạ mù, chấm trích dẫn, UNVERIFIED, ca sai). Key giải mù nằm
  # trong output_dir (không đưa cho người ánh xạ).
  sheets_dir: data/eval/sheets
  max_hypotheses: 5                   # A/B/no_library sinh tối đa bấy nhiêu giả thuyết (đủ cho top-3)
  # Truy vấn chung của baseline B theo loại bất thường: KHÔNG lấy từ thư viện (B không có thư viện).
  # Nhóm duyệt: truy vấn quá sát thư viện sẽ làm B mạnh lên một cách không công bằng và ngược lại.
  baseline_queries:
    inventory_increase:
      - hàng tồn kho
      - nguyên vật liệu tồn kho
      - thành phẩm tồn kho
      - dự phòng giảm giá hàng tồn kho
      - hàng mua đang đi đường
      - giá vốn hàng bán
    gross_margin_change:
      - lợi nhuận gộp
      - giá vốn hàng bán
      - doanh thu bán hàng
      - giá bán sản phẩm thép
      - giá nguyên vật liệu đầu vào
      - dự phòng giảm giá hàng tồn kho
  max_passages: 12                    # số đoạn tối đa đưa cho B / B_lib / no_verification
  # `other` trong đáp án có tính là trúng khi giả thuyết của A/B được ánh xạ về `other` không?
  # false (mặc định, thận trọng): hai "other" có thể là hai nguyên nhân khác nhau; C không sinh được
  # `other` nên tính trúng sẽ thiên vị A/B. Nhóm chốt trước khi chạy test.
  other_counts_as_hit: false
  top_ks: [1, 3]
  # Chấm trích dẫn (citation support rate, spec 15.3): hai người chấm mù; chỉ `supports` tính là hỗ trợ.
  citation_ratings: [supports, partial, not_supports]
  # Nguyên nhân thật của một UNVERIFIED (chất lượng UNVERIFIED, spec 15.3/15.6). Người gán.
  unverified_causes: [public_data_insufficient, retrieval_miss, rule_wrong, data_extraction_error, other]
  bootstrap:
    samples: 2000
    seed: 20261025
    level: 0.95
  # Giá token để tính tiền mỗi ca (spec 15.3). null = chưa khai: chỉ báo token, không báo tiền.
  # Nhóm chốt gemini-3.5-flash-lite FREE TIER (2026-10-25) → tiền thật = 0. Giá gói trả phí của
  # model này (0,30 / 2,50) và các model khác: configs/cost/pricing.yaml, docs/COST_ESTIMATE.md.
  pricing:
    currency: USD
    input_per_mtok: 0.0
    output_per_mtok: 0.0
