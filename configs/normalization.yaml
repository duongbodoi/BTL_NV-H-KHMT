# Chuẩn hóa metric cho phạm vi đề tài (spec Phase 3, mục 7.1, 16, 23).
# Dữ liệu là BCTC NĂM (OCR ViFinQA): khóa kỳ là năm tài chính `FY<năm>` kèm `fiscal_period_end`.
# Đây là từ điển nhãn BCTC Việt Nam (TT200) do Claude soạn làm điểm xuất phát; nhóm rà và bổ sung
# theo tài liệu thật của các công ty đã chọn. Không chứa tên công ty.

# Quy đổi mọi số tiền về VND. Đơn vị không có ở đây → fact UNRESOLVED (unit_unknown), không đoán.
unit_scales:
  VND: 1
  thousand_VND: 1000
  million_VND: 1000000
  billion_VND: 1000000000

# Cờ của Phase 2 làm số không gán được vào (công ty, năm tài chính, metric): candidate bị loại và
# ghi vào `rejections` kèm lý do, không bị bỏ im lặng. Cờ khác được giữ lại trong validation_flags.
# Cờ đơn vị (unit_*) không nằm ở đây: số vẫn thành fact nhưng UNRESOLVED (unit_unknown).
# `period_relative` được giải bằng ngữ cảnh báo cáo (xem `periods`) trước khi áp dụng danh sách này.
blocking_flags:
  - period_missing
  - period_ambiguous
  - period_invalid
  - period_incomplete
  - period_relative
  - period_cumulative
  - period_unresolved
  - company_missing
  - item_missing
  - no_header
  - no_label_column
  - empty_row_label
  - block_flagged
  - column_numbering_row
  - ragged_rows

periods:
  # Header của số liệu dòng (flow) chỉ có năm: coi là số cả năm nếu text không chứa từ nào dưới đây.
  non_annual_keywords: ["quý", "tháng", "kỳ", "lũy kế", "luỹ kế", "giữa niên độ"]
  # Header flow có ngày cụ thể (ví dụ "30/6/2023") phải chứa một trong các CỤM này mới là số cả
  # năm; ngày trần, hay chữ "năm" chỉ nằm trong tiêu đề bảng ("... năm 2022 (soát xét)"), không
  # cho biết kỳ dài bao lâu → flow_duration_unknown.
  annual_keywords: ["năm kết thúc", "năm tài chính", "cho năm"]
  # Header tương đối ("Năm nay", "Số đầu năm") được quy về năm của báo cáo (đọc từ chính văn bản
  # tài liệu: "kết thúc ngày D tháng M năm Y"). Không đọc được năm của báo cáo → loại.
  current_period_keywords: ["năm nay", "số cuối năm", "cuối năm", "cuối kỳ", "kỳ này", "năm tài chính này"]
  prior_period_keywords: ["năm trước", "số đầu năm", "đầu năm", "đầu kỳ", "kỳ trước", "năm tài chính trước"]

# Đơn vị khi bảng không ghi: chỉ dùng nếu văn bản tài liệu nói trình bày bằng đồng Việt Nam VÀ
# không có câu nào nói trình bày theo bậc nghìn/triệu/tỷ. Số lấy theo cách này có cờ unit_from_document.
document_unit:
  unit: VND
  statements: ["bằng đồng việt nam"]
  scaled_statements: ["nghìn đồng", "ngàn đồng", "triệu đồng", "tỷ đồng", "nghìn vnd", "triệu vnd"]

resolution:
  # Hai nguồn lệch nhau quá ngưỡng tương đối này → UNRESOLVED (source_conflict).
  # 0 = phải bằng nhau tuyệt đối (sau quy đổi VND). Nhóm chỉnh nếu nguồn có cấu trúc làm tròn.
  relative_tolerance: 0

# Mỗi metric:
#   kind: stock (số dư tại một ngày) | flow (số phát sinh trong kỳ)
#   aliases: nhãn dòng OCR (khớp TRỌN sau chuẩn hóa: bỏ số thứ tự đầu dòng, chú thích/công thức cuối dòng)
#   structured_aliases: tên chỉ tiêu trong CSV có cấu trúc, khớp trọn. Nhánh CSV hiện không dùng.
#   codes: mã số TT200. Dòng có mã mà không nằm trong danh sách → loại (code_mismatch); metric có
#       codes mà dòng OCR không có mã → loại (code_missing). Nhiều metric được dùng chung nhãn nếu
#       codes không giao nhau.
#   column_includes / column_excludes: từ khóa trong header cột (bảng thuyết minh có cột Giá gốc/Dự phòng)
#   requires_table_labels: bảng OCR phải chứa đủ các nhãn này
#   expected_sign / flip_sign: kiểm dấu. flip_sign dùng cho khoản chi (capex ghi âm trên báo cáo
#       lưu chuyển tiền tệ). Với CSV, metric flip_sign lấy độ lớn (cờ sign_not_checked).
#   magnitude: true → lưu độ lớn dương, số ghi âm (công ty ghi giá vốn trong ngoặc) được đổi dấu và
#       ghi cờ sign_normalized.
metrics:
  inventory_total:
    kind: stock
    aliases: ["hàng tồn kho"]
    structured_aliases: []
    codes: ["140"]
  inventory_gross:
    kind: stock
    aliases: ["hàng tồn kho"]
    structured_aliases: []
    codes: ["141"]
  inventory_provision:
    kind: stock
    aliases: ["dự phòng giảm giá hàng tồn kho"]
    structured_aliases: []
    codes: ["149"]
    expected_sign: negative
  raw_materials:
    kind: stock
    aliases: ["nguyên liệu, vật liệu", "nguyên vật liệu", "nguyên liệu vật liệu"]
    structured_aliases: []
    column_includes: ["giá gốc"]
    requires_table_labels: ["thành phẩm"]
  finished_goods:
    kind: stock
    aliases: ["thành phẩm"]
    structured_aliases: []
    column_includes: ["giá gốc"]
    requires_table_labels: ["thành phẩm"]
  work_in_progress:
    kind: stock
    aliases: ["chi phí sản xuất kinh doanh dở dang", "chi phí sản xuất, kinh doanh dở dang"]
    structured_aliases: []
    column_includes: ["giá gốc"]
    requires_table_labels: ["thành phẩm"]
  construction_in_progress:
    kind: stock
    aliases: ["xây dựng cơ bản dở dang", "chi phí xây dựng cơ bản dở dang"]
    structured_aliases: []
    codes: ["242"]
  net_revenue:
    kind: flow
    aliases:
      - "doanh thu thuần về bán hàng và cung cấp dịch vụ"
      - "doanh thu thuần bán hàng và cung cấp dịch vụ"
      - "doanh thu thuần từ bán hàng và cung cấp dịch vụ"
    structured_aliases: []
    codes: ["10"]
  cogs:
    kind: flow
    aliases: ["giá vốn hàng bán và dịch vụ cung cấp", "giá vốn hàng bán"]
    structured_aliases: []
    codes: ["11"]
    magnitude: true
  gross_profit:
    kind: flow
    aliases:
      - "lợi nhuận gộp về bán hàng và cung cấp dịch vụ"
      - "lợi nhuận gộp từ bán hàng và cung cấp dịch vụ"
      - "lợi nhuận gộp"
    structured_aliases: []
    codes: ["20"]
  capex:
    kind: flow
    aliases:
      - "tiền chi mua sắm, xây dựng tài sản cố định và tài sản dài hạn khác"
      - "tiền chi để mua sắm, xây dựng tscđ và các tài sản dài hạn khác"
    structured_aliases: []
    codes: ["21"]
    expected_sign: negative   # báo cáo ghi chi ra là số âm
    flip_sign: true           # fact lưu độ lớn dương; số dương bất ngờ → UNRESOLVED (unexpected_sign)

# Metric dẫn xuất do code tính (không do LLM).
derived:
  gross_margin:
    numerator: gross_profit
    denominator: net_revenue
