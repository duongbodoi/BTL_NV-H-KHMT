# Bước 4 — Báo cáo grounded (spec mục 13, Phase 11). Các giá trị là ĐỀ XUẤT khởi điểm của Claude
# (2026-10-24); nhóm chốt trước khi đóng băng tập test (thay đổi làm hash freeze lệch).

top_k: 3                  # số hạng đưa vào báo cáo (hòa hạng ở hạng k thì lấy cả nhóm hòa)
max_attempts: 3           # 1 bản nháp + tối đa 2 lần sinh lại khi bộ kiểm phát hiện lệch
# Hết số lần mà vẫn lệch: skeleton_only = chỉ giữ phần do code dựng (an toàn, mặc định);
# drop_failing = giữ các khẳng định qua mọi kiểm, bỏ khẳng định lỗi.
on_exhausted: skeleton_only
max_claims: 40
max_claim_chars: 600

numbers:
  # Ngoài sai số làm tròn của chính chữ số cuối mà LLM viết (nửa đơn vị), cho thêm dung sai tương đối.
  relative_tolerance: 0.0001
  # Các mẫu (regex, PHÂN BIỆT hoa/thường; thêm (?i) nếu cần) bị bỏ qua khi trích số. Code tự bỏ qua
  # mã nguồn/mã giả thuyết CÓ THẬT, và năm/ngày có năm thuộc dữ liệu đầu vào của báo cáo.
  exempt_patterns:
    - '\bFY\s?\d{4}\b'
    - '(?i)\btháng\s+\d{1,2}\b'
    - '(?i)\bquý\s+[1-4]\b'
    - '(?i)\btop[- ]?\d+\b'

# Đơn vị hiển thị của chỉ báo bất thường (anomaly.indicators) và của giá trị check theo `tool`.
# ratio: 0,25 hiển thị 25,0%; ratio_diff: hiệu hai tỷ lệ, 0,055 hiển thị 5,5 điểm %;
# pp: đã là điểm phần trăm; days: ngày; z: điểm z; vnd: đồng; number: số thường.
indicator_units:
  inv_growth_yoy: ratio
  rev_growth_yoy: ratio
  dio: days
  dio_prev: days
  inv_to_revenue: ratio
  inv_to_revenue_change: ratio_diff
  raw_share: ratio
  fg_share: ratio
  wip_share: ratio
  inv_minus_rev_growth: ratio_diff
  dio_change_days: days
  inv_growth_vs_peer: ratio_diff
  inv_growth_z: z
  inv_growth_mad_z: z
  gross_margin: ratio
  gross_margin_prev: ratio
  gm_change_pp: pp
  gm_vs_peer_pp: pp
  gm_change_vs_peer_pp: pp
  gm_change_z: z
  gm_change_mad_z: z
tool_units:
  growth_yoy: ratio
  growth_gap: ratio_diff
  days_inventory_change: days
  ratio: ratio
  ratio_change: ratio_diff
  ratio_of_changes: ratio
  share_of_change: ratio
  share_shift: ratio_diff
  growth_vs_peer: ratio_diff
  growth_vs_history: z
  lagged_external_series: ratio
  percentile_vs_history: ratio
  growth_vs_series: ratio_diff
  metric_level: vnd
  policy_text_similarity: ratio
# Đơn vị của fact đầu vào theo metric (không khai = vnd, tức tiền đồng).
fact_units:
  gross_margin: ratio
  export_revenue_share: ratio
  production_volume: number
  days_in_fiscal_year: number
# Đơn vị của chuỗi giá ngoài (chỉ để ghi nhãn).
series_units:
  iron_ore_price: USD/dmtu
  hrc_price: USD/tấn
  coking_coal_price: USD/tấn
  steel_price: USD/tấn
  usd_vnd: VND/USD

indicator_labels:
  inv_growth_yoy: tăng trưởng hàng tồn kho so với năm trước
  rev_growth_yoy: tăng trưởng doanh thu so với năm trước
  dio: số ngày tồn kho
  dio_prev: số ngày tồn kho năm trước
  inv_to_revenue: tồn kho trên doanh thu
  inv_to_revenue_change: thay đổi tỷ lệ tồn kho trên doanh thu
  raw_share: tỷ trọng nguyên vật liệu trong tồn kho gộp
  fg_share: tỷ trọng thành phẩm trong tồn kho gộp
  wip_share: tỷ trọng sản phẩm dở dang trong tồn kho gộp
  inv_minus_rev_growth: chênh lệch tăng trưởng tồn kho và doanh thu
  dio_change_days: thay đổi số ngày tồn kho
  inv_growth_vs_peer: chênh lệch tăng trưởng tồn kho so với trung vị ngành
  inv_growth_z: điểm z của tăng trưởng tồn kho so với lịch sử
  inv_growth_mad_z: điểm z (MAD) của tăng trưởng tồn kho so với lịch sử
  gross_margin: biên lợi nhuận gộp
  gross_margin_prev: biên lợi nhuận gộp năm trước
  gm_change_pp: thay đổi biên lợi nhuận gộp
  gm_vs_peer_pp: chênh lệch biên lợi nhuận gộp so với trung vị ngành
  gm_change_vs_peer_pp: chênh lệch thay đổi biên gộp so với trung vị ngành
  gm_change_z: điểm z của thay đổi biên gộp so với lịch sử
  gm_change_mad_z: điểm z (MAD) của thay đổi biên gộp so với lịch sử

# Cụm từ tiếng Việt nói về trạng thái kiểm chứng; code đối chiếu với trạng thái thật của giả thuyết
# (cùng với các từ SUPPORTED/PARTIAL/UNVERIFIED/CONTRADICTED). Bỏ qua khi có "không/chưa" ngay trước.
status_phrases:
  PARTIAL:
    - '(ủng hộ|xác thực) một phần'
  CONTRADICTED:
    - 'bị (phản bác|bác bỏ)'
  SUPPORTED:
    - 'được ủng hộ đầy đủ'
    - '(đã được|được) xác thực( đầy đủ)?'

# Bộ lọc nội dung cấm (spec mục 3.4, 13). Regex trên văn bản đã chuẩn hóa NFC, chữ thường. Một mẫu
# không tính khi có "không/chưa" trong ba từ ngay trước (ví dụ "không kết luận gian lận").
forbidden:
  investment_advice:
    - 'khuyến nghị\s+(mua|bán|nắm giữ|đầu tư|tích lũy)'
    - '\bnên\s+(\S+\s+){0,2}(mua|bán|nắm giữ|tích lũy|chốt lời)\b'
    - '\b(mua|bán|tích lũy|gom)\s+(vào\s+|ra\s+)?cổ phiếu\b(?!\s+quỹ)'
    - 'chốt lời'
    - 'giá mục tiêu'
    - 'tiềm năng tăng giá'
    - '\bupside\b'
    - 'cơ hội\s+(\S+\s+){0,2}(để\s+)?(mua|bán|tích lũy|đầu tư\s+(vào\s+)?cổ phiếu)\b(?!\s+(nguyên|vật|quặng|than|phôi|hàng|phế))'
    - 'định giá\s+(hấp dẫn|rẻ|đắt)'
    - '\b(buy|sell|hold)\b'
  fraud:
    - 'gian lận'
    - 'lừa đảo'
    - 'thao túng'
    - '\blàm giả\b'   # \b: không khớp "làm giảm" (bắt oan khi chạy thật 2026-10-25)
    - 'xào nấu'
    - 'phù phép'
    - 'thổi phồng'
    - 'bóp méo'
    - 'ghi khống'
    - 'khai khống'
    - 'làm đẹp\s+(báo cáo|bctc|số liệu|sổ sách)'
    - 'che giấu\s+(lỗ|số liệu|khoản)'
    - 'window dressing'
    - '\bfraud'
  certainty:
    - 'chắc chắn'
    - 'không\s+(còn\s+)?(nghi ngờ|phải bàn)'
    - 'đã\s+chứng minh'
    - 'chứng minh\s+(rằng|được)'
    - 'rõ ràng là'
    - 'nguyên nhân duy nhất'
    - 'khẳng định\s+(rằng|chắc)'
# Khẳng định nhân quả: chỉ được phép khi khẳng định gắn với giả thuyết SUPPORTED, hoặc khi câu có
# từ rào đón (hedges). Mục missing được miễn (ở đó "vì thiếu dữ liệu" nói về dữ liệu, không phải nhân
# quả kinh doanh). Kết luận (mục 7 của báo cáo) phải có ít nhất một từ rào đón.
causal:
  - 'là nguyên nhân'
  - 'nguyên nhân\s+(chính|là)'
  - 'gây ra'
  - 'dẫn đến'
  - '\bdo đó\b'
  - 'bởi vì'
  - 'xuất phát từ'
  - 'là kết quả của'
  - '\b(tăng|giảm|thu hẹp|cải thiện|mở rộng|biến động|thay đổi|đi xuống|đi lên)\s+(\S+\s+){0,2}(là\s+)?(do|vì|nhờ)\b'
  - '\bkhiến\b'
  - 'kéo theo'
  - 'làm cho'
# Cụm THUẬT LẠI giả thuyết: mẫu nhân quả nằm sau cụm này trong cùng câu/vế (ngăn bởi . ; : ! ?) là
# đang nêu nội dung giả thuyết ("Giả thuyết tồn kho tăng do mùa vụ ... UNVERIFIED"), không phải khẳng
# định. Thêm 2026-10-25 sau lần chạy thật: ~38/40 lỗi unhedged_causal là loại này. Trạng thái nêu
# trong câu vẫn được kiểm riêng (status_mismatch).
attribution:
  - '\bgiả thuyết\b'
  - 'cho rằng'
hedges:
  - 'có thể(?!\s+(thấy|nhận thấy|khẳng định))'
  - 'nhiều khả năng'
  - 'phù hợp với'
  - '\bnếu\b(?!\s+xét)'
  - 'chưa đủ'
  - 'chưa xác thực'
  - 'chưa kiểm'
  - 'với điều kiện'
  - 'cần thêm'
  - 'chưa thể'
  - 'gợi ý'
  - 'cho thấy khả năng'

disclaimer: "Hỗ trợ phân tích, không phải tư vấn đầu tư. Không kết luận gian lận."
draft_warning: "Kết quả chạy thử trên giả thuyết chưa được nhóm duyệt (draft): không dùng để đánh giá."
