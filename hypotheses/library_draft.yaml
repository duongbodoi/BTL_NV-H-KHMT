# Thư viện giả thuyết. Nguồn ghi đầy đủ (tên, ngày, link) theo library_draft_update.yaml của nhóm (2026-10-25).
# Đã duyệt: 22 giả thuyết, reviewed_by: Nguyễn Tùng Dương (nhóm xác nhận 2026-10-25).
# Trường `checks` (dạng có cấu trúc) sẽ được thêm ở Phase 6 theo spec mục 10.1.
# Metric có hậu tố "*" là chỉ tiêu Phase 3 chưa trích, cần bổ sung.
# direction: up | down | both. anomaly_type giữ tên khóa trong code (inventory_increase xét hai chiều).

hypotheses:

  - id: inventory_raw_material_stockpiling
    code: INV-1
    anomaly_type: inventory_increase
    direction: up
    claim: Tồn kho tăng do doanh nghiệp tích trữ nguyên vật liệu khi giá đầu vào ở vùng thấp.
    business_rationale: Doanh nghiệp thép mua trữ nguyên liệu giá rẻ để hưởng lợi khi giá tăng; đây là "con dao hai lưỡi" khi giá đảo chiều.
    expected_quantitative_evidence:
      - raw_materials tăng và chiếm phần lớn mức tăng tồn kho
      - giá quặng sắt hoặc HRC cuối kỳ ở vùng thấp so với trung vị nhiều năm (chỉ dùng dữ liệu đến mốc as-of)
    expected_textual_evidence: [dự trữ nguyên liệu, tích trữ, giá nguyên liệu thấp]
    contradictory_evidence:
      - giá đầu vào đang ở vùng cao
      - mức tăng tồn kho chủ yếu ở thành phẩm
    required_external_data: [iron_ore_price, hrc_price]
    critical_missing_evidence:
      - không có giá đầu vào tại thời điểm cuối kỳ
    testable_with_annual_data: partial
    sources:
      - "Báo cáo giữa kỳ nhóm 8, mục 2.2"
      - "Tạp chí Công Thương — Tồn kho các doanh nghiệp trước bối cảnh giá thép tăng cao (24/02/2019) https://tapchicongthuong.vn/ton-kho-cac-doanh-nghiep-truoc-boi-canh-gia-thep-tang-cao-60518.htm"
      - "Nhà Đầu tư — 'Con dao hai lưỡi' của doanh nghiệp thép (05/05/2021) https://nhadautu.vn/con-dao-hai-luoi-cua-doanh-nghiep-thep-d51392.html"
      - "VCSC, VNDirect (qua VietnamFinance) — Doanh nghiệp thép: áp lực sau giai đoạn thăng hoa (27/02/2022) https://vietnamfinance.vn/doanh-nghiep-thep-ap-luc-sau-giai-doan-thang-hoa-d77178.html"
    checks:   # ĐỀ XUẤT của Claude (2026-10-24, đã rà sau review Phase 8): nhóm rà ngưỡng/tool
      - id: raw_materials_main_driver
        kind: quant
        importance: critical
        polarity: support
        tool: share_of_change
        params:
          component: raw_materials
          total: inventory_total
        pass_when:
          op: '>='
          value: 0.5
      - id: input_price_low
        kind: quant
        importance: critical
        polarity: support
        tool: percentile_vs_history
        params:
          series:
          - iron_ore_price
          - hrc_price
          asof_only: true
        pass_when:
          op: <=
          value: 0.33
          any: true
      - id: input_price_high
        kind: quant
        importance: supporting
        polarity: contradict
        tool: percentile_vs_history
        params:
          series:
          - iron_ore_price
          - hrc_price
          asof_only: true
        pass_when:
          op: '>='
          value: 0.67
          any: true
      - id: finished_goods_main_driver
        kind: quant
        importance: supporting
        polarity: contradict
        tool: share_of_change
        params:
          component: finished_goods
          total: inventory_total
        pass_when:
          op: '>='
          value: 0.5
      - id: stockpile_text
        kind: text
        importance: supporting
        polarity: support
        # truy vấn do nhóm (Nguyễn Tùng Dương) chỉnh 2026-10-25 sau khi đối chiếu BCTC thật
        queries:
        - dự trữ nguyên liệu
        - tích trữ nguyên liệu
        - giá nguyên liệu thấp
    status: reviewed
    reviewed_by: Nguyễn Tùng Dương

  - id: inventory_capacity_expansion
    code: INV-2
    anomaly_type: inventory_increase
    direction: up
    claim: Tồn kho tăng do chuẩn bị mở rộng sản xuất.
    business_rationale: Dự án công suất mới cần nguyên liệu dự trữ trước khi vận hành.
    expected_quantitative_evidence:
      - cip tăng
      - capex tăng
      - raw_materials tăng
    expected_textual_evidence: [dự án, mở rộng công suất, chạy thử, đưa vào vận hành]
    contradictory_evidence:
      - cip và capex giảm
      - dự án bị hoãn hoặc dừng
    required_external_data: []
    critical_missing_evidence:
      - không có bằng chứng nối trực tiếp mở rộng công suất với mức tăng tồn kho
    testable_with_annual_data: yes
    sources:
      - "Báo cáo giữa kỳ nhóm 8, mục 2.2"
      - "KBSV — Báo cáo cập nhật HPG (16/02/2023) https://www.kbsec.com.vn/pic/Service/KBSV_HPG_Baocaocapnhat_230216.pdf"
      - "DSC — Báo cáo cập nhật HPG Q1/2023 (05/05/2023) https://extgw.dsc.com.vn/eback/uploads/2023/05/BaoCaoCapNhat_HPG_Q1.2023_DSC.pdf"
    source_strength: weak   # chưa có nguồn ngoài nối trực tiếp cơ chế
    checks:   # ĐỀ XUẤT của Claude (2026-10-24, đã rà sau review Phase 8): nhóm rà ngưỡng/tool
      - id: capex_up
        kind: quant
        importance: critical
        polarity: support
        tool: growth_yoy
        params:
          metric: capex
        pass_when:
          op: '>='
          value: 0.2
          signed_by_anomaly_direction: true
      - id: cip_up
        kind: quant
        importance: supporting
        polarity: support
        tool: growth_yoy
        params:
          metric: construction_in_progress
        pass_when:
          op: '>='
          value: 0.2
          signed_by_anomaly_direction: true
      - id: raw_materials_up
        kind: quant
        importance: supporting
        polarity: support
        tool: growth_yoy
        params:
          metric: raw_materials
        pass_when:
          op: '>='
          value: 0.2
          signed_by_anomaly_direction: true
      - id: expansion_text
        kind: text
        importance: critical
        polarity: support
        # truy vấn do nhóm (Nguyễn Tùng Dương) chỉnh 2026-10-25 sau khi đối chiếu BCTC thật: bỏ
        # "dự án mở rộng công suất", "chạy thử" (không xuất hiện trong file nào); KHÔNG dùng
        # "xây dựng cơ bản dở dang", "đưa vào sử dụng" và từ đơn "dự án"/"nhà máy"/"đầu tư" (quá chung)
        queries:
        - dự án mở rộng
        - mở rộng nhà máy
        - dự án nhà máy
        - khu liên hợp
        - cam kết chi tiêu vốn
        - đi vào hoạt động
        - đưa vào vận hành
      - id: cip_down
        kind: quant
        importance: supporting
        polarity: contradict
        tool: growth_yoy
        params:
          metric: construction_in_progress
        pass_when:
          op: <=
          value: -0.2
      - id: capex_down
        kind: quant
        importance: supporting
        polarity: contradict
        tool: growth_yoy
        params:
          metric: capex
        pass_when:
          op: <=
          value: -0.2
      - id: project_delayed_text
        kind: text
        importance: supporting
        polarity: contradict
        queries:
        - dự án bị hoãn
        - dừng dự án
    status: reviewed
    reviewed_by: Nguyễn Tùng Dương

  - id: inventory_weak_demand
    code: INV-3
    anomaly_type: inventory_increase
    direction: up
    claim: Tồn kho tăng do hàng bán chậm, nhu cầu yếu.
    business_rationale: Cầu giảm so với kế hoạch làm thành phẩm tồn đọng; tồn kho tăng nhanh hơn doanh thu là tín hiệu xấu về lợi nhuận tương lai.
    expected_quantitative_evidence:
      - finished_goods tăng nhanh hơn doanh thu
      - (Δ tồn kho) − (Δ doanh thu) > 0
      - số ngày tồn kho tăng
      - inventory_provision tăng
    expected_textual_evidence: [tiêu thụ chậm, nhu cầu yếu, sức mua giảm, trích lập dự phòng]
    contradictory_evidence:
      - doanh thu tăng mạnh
      - mức tăng tồn kho nằm ở nguyên vật liệu
    required_external_data: []
    critical_missing_evidence:
      - không tách được thành phần tồn kho (thuyết minh thiếu)
    testable_with_annual_data: yes
    sources:
      - "Báo cáo giữa kỳ nhóm 8, mục 2.2"
      - "VDSC (qua Mekong ASEAN) — Hoa Sen gặp khó gấp đôi so với doanh nghiệp cùng ngành (09/02/2023) https://mekongasean.vn/vdsc-hoa-sen-gap-kho-gap-doi-so-voi-cac-doanh-nghiep-cung-nganh-22900.html"
      - "KIS — HSG brief 3Q22 (04/11/2022) https://kisvn.vn/wp-content/uploads/2022/11/HSG-brief-3Q22-vie.pdf"
      - "Thomas & Zhang — Inventory changes and future returns (Review of Accounting Studies) (2002) https://doi.org/10.1023/a:1020274002135"
      - "Luchs, Maheshwari & Myring — tín hiệu tồn kho của Lev & Thiagarajan (1993) (không ghi ngày) https://w.aabri.com/manuscripts/111037.pdf"
    checks:   # ĐỀ XUẤT của Claude (2026-10-24, đã rà sau review Phase 8): nhóm rà ngưỡng/tool
      - id: inventory_outpaces_revenue
        kind: quant
        importance: critical
        polarity: support
        tool: growth_gap
        params:
          a: inventory_total
          b: net_revenue
        pass_when:
          op: '>'
          value: 0
          signed_by_anomaly_direction: true
      - id: finished_goods_outpaces_revenue
        kind: quant
        importance: critical
        polarity: support
        tool: growth_gap
        params:
          a: finished_goods
          b: net_revenue
        pass_when:
          op: '>'
          value: 0
          signed_by_anomaly_direction: true
      - id: dio_up
        kind: quant
        importance: supporting
        polarity: support
        tool: days_inventory_change
        params: {}
        pass_when:
          op: '>'
          value: 0
          signed_by_anomaly_direction: true
      - id: provision_up
        kind: quant
        importance: supporting
        polarity: support
        tool: growth_yoy
        params:
          metric: inventory_provision
        pass_when:
          op: '>'
          value: 0
          signed_by_anomaly_direction: true
      - id: revenue_strong
        kind: quant
        importance: supporting
        polarity: contradict
        tool: growth_yoy
        params:
          metric: net_revenue
        pass_when:
          op: '>='
          value: 0.2
      - id: raw_materials_main_driver
        kind: quant
        importance: supporting
        polarity: contradict
        tool: share_of_change
        params:
          component: raw_materials
          total: inventory_total
        pass_when:
          op: '>='
          value: 0.5
      - id: weak_demand_text
        kind: text
        importance: supporting
        polarity: support
        # truy vấn do nhóm (Nguyễn Tùng Dương) chỉnh 2026-10-25 sau khi đối chiếu BCTC thật
        queries:
        - tiêu thụ chậm
        - nhu cầu yếu
        - sức mua giảm
    status: reviewed
    reviewed_by: Nguyễn Tùng Dương

  - id: inventory_seasonality
    code: INV-4
    anomaly_type: inventory_increase
    direction: both
    claim: Tồn kho tăng do yếu tố mùa vụ.
    business_rationale: Tiêu thụ thép xây dựng giảm vào mùa mưa và tăng vào mùa xây dựng; doanh nghiệp tích hàng trước mùa cao điểm.
    expected_quantitative_evidence:
      - cùng kỳ các năm trước có đỉnh tồn kho tương tự (cần dữ liệu quý)
    expected_textual_evidence: [mùa xây dựng, mùa mưa, cao điểm cuối năm]
    contradictory_evidence:
      - các năm trước cùng kỳ không có đỉnh
    required_external_data: []
    critical_missing_evidence:
      - không có dữ liệu theo quý
    testable_with_annual_data: no   # dự kiến UNVERIFIED, phân tích ở RQ3
    sources:
      - "Báo cáo giữa kỳ nhóm 8, mục 2.2"
      - "Elibook — HPG: sản lượng tháng 6 giảm nhẹ do chu kỳ mùa mưa (18/07/2024) https://elibook.vn/2024/07/18/hpg-san-luong-thep-tieu-thu-thang-6-giam-nhe-do-chu-ky-mua-mua-loi-nhuan-quy-2-gan-3500-ty/"
    checks:   # ĐỀ XUẤT của Claude (2026-10-24, đã rà sau review Phase 8): nhóm rà ngưỡng/tool
      - id: seasonal_text
        kind: text
        importance: critical
        polarity: support
        queries:
        - mùa xây dựng
        - mùa mưa
        - cao điểm cuối năm
      - id: not_seasonal_text
        kind: text
        importance: supporting
        polarity: contradict
        queries:
        - tồn kho không mang tính mùa vụ
    status: reviewed
    reviewed_by: Nguyễn Tùng Dương

  - id: inventory_price_not_volume
    code: INV-5
    anomaly_type: inventory_increase
    direction: up
    claim: Giá trị tồn kho tăng do giá đầu vào tăng, không phải số lượng tăng.
    business_rationale: BCTC ghi tồn kho theo giá trị; giá nguyên liệu tăng làm giá trị tồn kho tăng dù lượng không đổi.
    expected_quantitative_evidence:
      - mức tăng giá trị tồn kho xấp xỉ mức tăng giá nguyên liệu
    expected_textual_evidence: [số lượng tồn kho, sản lượng tồn kho (báo cáo thường niên)]
    contradictory_evidence:
      - giá đầu vào đi ngang hoặc giảm trong khi tồn kho tăng mạnh
      - số lượng tồn kho tăng
    required_external_data: [iron_ore_price, hrc_price]
    critical_missing_evidence:
      - BCTC không công bố số lượng tồn kho
    testable_with_annual_data: partial
    sources:
      - "Báo cáo giữa kỳ nhóm 8, mục 2.2"
      - "Nhà Đầu tư — 'Con dao hai lưỡi' của doanh nghiệp thép (05/05/2021) https://nhadautu.vn/con-dao-hai-luoi-cua-doanh-nghiep-thep-d51392.html"
      - "VCSC, VNDirect (qua VietnamFinance) — Doanh nghiệp thép: áp lực sau giai đoạn thăng hoa (27/02/2022) https://vietnamfinance.vn/doanh-nghiep-thep-ap-luc-sau-giai-doan-thang-hoa-d77178.html"
    source_strength: weak   # S8, S9 chỉ hỗ trợ gián tiếp
    checks:   # ĐỀ XUẤT của Claude (2026-10-24, đã rà sau review Phase 8): nhóm rà ngưỡng/tool
      - id: inventory_growth_tracks_input_price
        kind: quant
        importance: critical
        polarity: support
        tool: growth_vs_series
        params:
          metric: inventory_total
          series:
          - iron_ore_price
          - hrc_price
        pass_when:
          op: <=
          value: 0.1
          abs: true
      - id: input_price_flat_or_down
        kind: quant
        importance: critical
        polarity: contradict
        tool: lagged_external_series
        params:
          series:
          - iron_ore_price
          - hrc_price
          lag: from_config
        pass_when:
          op: <=
          value: 0
      - id: quantity_text
        kind: text
        importance: supporting
        polarity: support
        queries:
        - số lượng tồn kho
        - sản lượng tồn kho
      - id: quantity_up_text
        kind: text
        importance: supporting
        polarity: contradict
        queries:
        - số lượng tồn kho tăng
    status: reviewed
    reviewed_by: Nguyễn Tùng Dương

  - id: inventory_accounting_policy_change
    code: INV-6
    anomaly_type: inventory_increase
    direction: both
    claim: Biến động tồn kho do thay đổi chính sách kế toán hàng tồn kho.
    business_rationale: VAS 02 yêu cầu áp dụng nhất quán phương pháp tính giá; thay đổi phương pháp làm thay đổi giá trị tồn kho mà không phản ánh kinh doanh.
    expected_quantitative_evidence:
      - biến động không giải thích được bằng các chỉ tiêu hoạt động
    expected_textual_evidence: [thay đổi chính sách kế toán, phương pháp tính giá hàng tồn kho, bình quân gia quyền, nhập trước xuất trước]
    contradictory_evidence:
      - đoạn chính sách hàng tồn kho giữ nguyên giữa hai năm
    required_external_data: []
    critical_missing_evidence:
      - không trích được đoạn chính sách kế toán của một trong hai năm
    testable_with_annual_data: yes
    sources:
      - "Báo cáo giữa kỳ nhóm 8, mục 2.2"
      - "Tạp chí Kinh tế – Tài chính — Nguyên tắc kế toán hàng tồn kho (VAS 02) (26/01/2026) https://nghiencuu.tapchikinhtetaichinh.vn/nguyen-tac-ke-toan-hang-ton-kho-va-luu-y-trong-ap-dung-tai-doanh-nghiep-142966.html"
    checks:   # ĐỀ XUẤT của Claude (2026-10-24, đã rà sau review Phase 8): nhóm rà ngưỡng/tool
      - id: policy_change_text
        kind: text
        importance: critical
        polarity: support
        # nhóm chỉnh 2026-10-25: bỏ "bình quân gia quyền", "phương pháp tính giá hàng tồn kho",
        # "nhập trước xuất trước" (có trong MỌI BCTC: mô tả chính sách, không phải dấu hiệu thay đổi)
        queries:
        - thay đổi chính sách kế toán
        - áp dụng phi hồi tố
        - trình bày lại
      # nhóm chỉnh 2026-10-25: thay check văn bản bằng CODE so đoạn chính sách hàng tồn kho năm N
      # với N-1 (giống nhau = bằng chứng phản bác). Ngưỡng 0.9 là ĐỀ XUẤT tạm của Claude (đo trên
      # kho 2016-2023: 21/23 cặp năm >= 0.95; HSG 2019 = 0.33, NKG 2017 = 0.54 do viết lại đoạn);
      # nhóm chốt trước khi đóng băng.
      - id: policy_unchanged
        kind: quant
        importance: critical
        polarity: contradict
        tool: policy_text_similarity
        params:
          item: hàng tồn kho
        pass_when:
          op: '>='
          value: 0.9
    status: reviewed
    reviewed_by: Nguyễn Tùng Dương

  - id: inventory_goods_in_transit_timing
    code: INV-7
    anomaly_type: inventory_increase
    direction: up
    claim: Tồn kho tăng do hàng mua đang đi đường hoặc thời điểm nhập hàng sát cuối kỳ.
    business_rationale: Doanh nghiệp nhập khẩu nguyên liệu ghi nhận hàng đi đường vào tồn kho; lô hàng lớn về sát ngày khóa sổ làm tồn kho cuối kỳ tăng tạm thời.
    expected_quantitative_evidence:
      - goods_in_transit* tăng và chiếm phần lớn mức tăng tồn kho
      - phải trả người bán tăng
    expected_textual_evidence: [hàng mua đang đi trên đường, nhập khẩu]
    contradictory_evidence:
      - hàng đi đường ổn định
    required_external_data: []
    critical_missing_evidence:
      - "không có số dư hàng mua đang đi đường trong thuyết minh tồn kho"
    testable_with_annual_data: yes
    sources:
      - "VDSC (qua Mekong ASEAN) — Hoa Sen gặp khó gấp đôi so với doanh nghiệp cùng ngành (09/02/2023) https://mekongasean.vn/vdsc-hoa-sen-gap-kho-gap-doi-so-voi-cac-doanh-nghiep-cung-nganh-22900.html"
      - "Nhà Đầu tư — 'Con dao hai lưỡi' của doanh nghiệp thép (05/05/2021) https://nhadautu.vn/con-dao-hai-luoi-cua-doanh-nghiep-thep-d51392.html"
    extension_beyond_midterm: true
