    claim: Tồn kho giảm do doanh nghiệp xả hàng, bán giảm giá để giải phóng tồn kho giá cao.
    business_rationale: Khi giá bán giảm liên tục, doanh nghiệp phải cạnh tranh đầu ra và chấp nhận biên thấp để giải phóng thành phẩm giá vốn cao.
    expected_quantitative_evidence:
      - finished_goods giảm
      - biên gộp giảm cùng kỳ
      - doanh thu không giảm tương ứng
    expected_textual_evidence: [giảm giá bán, cạnh tranh đầu ra, giải phóng hàng tồn kho]
    contradictory_evidence:
      - biên gộp ổn định hoặc tăng
    required_external_data: []
    critical_missing_evidence:
      - "không có số dư thành phẩm hoặc biên gộp cùng kỳ"
    testable_with_annual_data: yes
    sources:
      - "VDSC (qua Mekong ASEAN) — Hoa Sen gặp khó gấp đôi so với doanh nghiệp cùng ngành (09/02/2023) https://mekongasean.vn/vdsc-hoa-sen-gap-kho-gap-doi-so-voi-cac-doanh-nghiep-cung-nganh-22900.html"
      - "KBSV — Báo cáo cập nhật NKG (24/03/2023) https://www.kbsec.com.vn/pic/Service/KBSV_NKG_Baocaocapnhat_230323.pdf"
    checks:   # ĐỀ XUẤT của Claude (2026-10-24): nhóm rà ngưỡng/tool
      - id: finished_goods_down
        kind: quant
        importance: critical
        polarity: support
        tool: growth_yoy
        params:
          metric: finished_goods
        pass_when:
          op: <=
          value: -0.1
      - id: gross_margin_down
        kind: quant
        importance: critical
        polarity: support
        tool: share_shift
        params:
          metric: gross_margin
        pass_when:
          op: <
          value: 0
      - id: revenue_not_down
        kind: quant
        importance: supporting
        polarity: support
        tool: growth_yoy
        params:
          metric: net_revenue
        pass_when:
          op: '>='
          value: -0.05
      - id: gross_margin_stable_or_up
        kind: quant
        importance: supporting
        polarity: contradict
        tool: share_shift
        params:
          metric: gross_margin
        pass_when:
          op: '>='
          value: 0
      - id: discount_text
        kind: text
        importance: supporting
        polarity: support
        queries:
        - giảm giá bán
        - cạnh tranh đầu ra
        - giải phóng hàng tồn kho
    status: reviewed
    reviewed_by: Nguyễn Tùng Dương

