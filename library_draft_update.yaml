    reviewed_by: null

  - id: inventory_accounting_policy_change
    code: INV-6
    anomaly_type: inventory_increase
    direction: both
    claim: Biến động tồn kho do thay đổi chính sách kế toán hàng tồn kho.
    business_rationale: VAS 02 yêu cầu áp dụng nhất quán phương pháp tính giá; thay đổi phương pháp làm thay đổi giá trị tồn kho mà không phản ánh kinh doanh.
    expected_quantitative_evidence:
      - biến động không giải thích được bằng các chỉ tiêu hoạt động
    expected_textual_evidence: [thay đổi chính sách kế toán, phương pháp tính giá hàng tồn kho, bình quân gia quyền, nhập trước xuất trước]
    contradictory_evidence:
      - đoạn chính sách hàng tồn kho giữ nguyên giữa hai năm
    required_external_data: []
    critical_missing_evidence:
      - không trích được đoạn chính sách kế toán của một trong hai năm
    testable_with_annual_data: yes
    sources:
      - title: "Báo cáo giữa kỳ nhóm 8, mục 2.2"
        date: ""
