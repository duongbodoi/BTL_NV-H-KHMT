  - id: inventory_seasonality
    code: INV-4
    anomaly_type: inventory_increase
    direction: both
    claim: Tồn kho tăng do yếu tố mùa vụ.
    business_rationale: Tiêu thụ thép xây dựng giảm vào mùa mưa và tăng vào mùa xây dựng; doanh nghiệp tích hàng trước mùa cao điểm.
    expected_quantitative_evidence:
      - cùng kỳ các năm trước có đỉnh tồn kho tương tự (cần dữ liệu quý)
    expected_textual_evidence: [mùa xây dựng, mùa mưa, cao điểm cuối năm]
    contradictory_evidence:
      - các năm trước cùng kỳ không có đỉnh
    required_external_data: []
    critical_missing_evidence:
      - không có dữ liệu theo quý
    testable_with_annual_data: no   # dự kiến UNVERIFIED, phân tích ở RQ3
    sources:
      - title: "Báo cáo giữa kỳ nhóm 8, mục 2.2"
        date: ""
      - title: "Elibook — HPG: sản lượng tháng 6 giảm nhẹ do chu kỳ mùa mưa"
        date: "18/07/2024"
        url: "https://elibook.vn/2024/07/18/hpg-san-luong-thep-tieu-thu-thang-6-giam-nhe-do-chu-ky-mua-mua-loi-nhuan-quy-2-gan-3500-ty/"
    status: draft
    reviewed_by: null

  - id: inventory_price_not_volume
    code: INV-5
    anomaly_type: inventory_increase
    direction: up
    claim: Giá trị tồn kho tăng do giá đầu vào tăng, không phải số lượng tăng.
    business_rationale: BCTC ghi tồn kho theo giá trị; giá nguyên liệu tăng làm giá trị tồn kho tăng dù lượng không đổi.
    expected_quantitative_evidence:
      - mức tăng giá trị tồn kho xấp xỉ mức tăng giá nguyên liệu
    expected_textual_evidence: [số lượng tồn kho, sản lượng tồn kho (báo cáo thường niên)]
    contradictory_evidence:
      - giá đầu vào đi ngang hoặc giảm trong khi tồn kho tăng mạnh
      - số lượng tồn kho tăng
    required_external_data: [iron_ore_price, hrc_price]
    critical_missing_evidence:
      - BCTC không công bố số lượng tồn kho
    testable_with_annual_data: partial
