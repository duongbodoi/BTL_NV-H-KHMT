      - cogs / net_revenue đổi theo
    expected_textual_evidence: [giá nguyên liệu, chi phí đầu vào]
    contradictory_evidence:
      - giá đầu vào đi cùng chiều biên gộp
    required_external_data: [iron_ore_price, coking_coal_price, hrc_price]
    critical_missing_evidence:
