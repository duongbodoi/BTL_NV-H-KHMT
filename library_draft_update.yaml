  - id: margin_inventory_provision
    code: GM-4
    anomaly_type: gross_margin_change
    direction: both
    claim: Biên gộp thay đổi do trích lập hoặc hoàn nhập dự phòng giảm giá hàng tồn kho.
    business_rationale: Dự phòng theo giá trị thuần có thể thực hiện được (VAS 02); trích lập kéo biên xuống, hoàn nhập đẩy biên lên.
    expected_quantitative_evidence:
      - inventory_provision_charge* (thuyết minh giá vốn) lớn so với mức thay đổi lợi nhuận gộp
      - inventory_provision đổi mạnh
    expected_textual_evidence: [trích lập dự phòng, hoàn nhập dự phòng]
    contradictory_evidence:
      - biến động dự phòng nhỏ so với mức thay đổi lợi nhuận gộp
    required_external_data: []
    critical_missing_evidence:
      - thuyết minh giá vốn không tách dòng dự phòng
    testable_with_annual_data: yes
    sources:
