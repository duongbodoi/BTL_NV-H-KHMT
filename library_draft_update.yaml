  - id: margin_inventory_cost_effect
    code: GM-3
    anomaly_type: gross_margin_change
    direction: both
    claim: Biên gộp thay đổi do hàng tồn kho mua giá cao (khi giá giảm) hoặc giá thấp (khi giá tăng).
    business_rationale: Giá vốn theo bình quân gia quyền phản ánh giá mua trước đó; tồn kho lớn khuếch đại tác động của biến động giá lên biên gộp.
    expected_quantitative_evidence:
      - tồn kho đầu kỳ lớn so với giá vốn
      - giá đầu vào giảm (biên giảm) hoặc tăng (biên tăng) trong kỳ
      - biên gộp đổi mạnh hơn mức chênh lệch giá bán – giá đầu vào
    expected_textual_evidence: [hàng tồn kho giá cao, giá vốn cao, nguyên liệu giá rẻ]
    contradictory_evidence:
      - tồn kho đầu kỳ nhỏ
      - giá đầu vào ổn định
    required_external_data: [iron_ore_price, hrc_price]
    critical_missing_evidence:
      - không có giá đầu vào trong kỳ
