        date: "2023-02-16"
        url: "https://www.kbsec.com.vn/pic/Service/KBSV_HPG_Baocaocapnhat_230216.pdf"
        page: ""
      - title: "KBSV – Báo cáo cập nhật HPG"
        date: "2022-11-16"
        url: "https://www.kbsec.com.vn/pic/Service/KBSV_Baocaocapnhat_HPG_20221116%20(2).pdf"
        page: "2-3, 5, 7"
