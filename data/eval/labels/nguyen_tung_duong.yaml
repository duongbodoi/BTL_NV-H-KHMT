        date: "2023-05-05"
        url: "https://extgw.dsc.com.vn/eback/uploads/2023/05/BaoCaoCapNhat_HPG_Q1.2023_DSC.pdf"
        page: ""
      - title: "ABS – Cập nhật ĐHĐCĐ 2023 HPG"
        date: "2023-03-31"
        url: "https://www.abs.vn/wp-content/uploads/2023/03/Bao-cao-cap-nhat-DHCD-2023-HPG.pdf"
        page: "1-2"
    note: >-
      GM-1 + GM-3 (KBSV 16/11/2022, tr. 2-3): "Biên lợi nhuận bị bào mòn nghiêm trọng do giá bán đầu ra
      giảm và áp lực tồn nguyên vật liệu giá cao từ Quý trước." GM-2 SUPPORTED, GM-6 PARTIAL theo các
      nguồn trên.

