        date: "2018-04-11"
        url: "https://baodauthau.vn/thep-nam-kim-rui-ro-khi-tang-truong-nong-post48809.html"
        page: ""   # bài báo, không có trang
      - title: "VietnamFinance – Thép Nam Kim: Tham vọng tăng trưởng và nỗi lo tồn kho, nợ nần"
        date: "2018-04-07"
        url: "https://vietnamfinance.vn/thep-nam-kim-tham-vong-tang-truong-va-noi-lo-ton-kho-no-nan-d17431.html"
        page: ""   # bài báo, không có trang
    note: >-
      INV-2 (Báo Đấu thầu): "cần phải gia tăng hàng tồn kho để bảo đảm hoạt động sản xuất từ việc tăng
      công suất". INV-5 (Báo Đấu thầu): "giá trị hàng tồn kho cũng gia tăng theo do giá nguyên liệu
      tăng". INV-7 (Báo Đấu thầu): "xuất hiện thêm hàng đang đi trên đường là 729,5 tỷ đồng".

  - case_id: C07
    reference_set: [other]
    statuses:
      inventory_weak_demand: CONTRADICTED
    sources:
      - title: "MBS – Báo cáo đầu tư HPG"
        date: "2022-04-04"
        url: "https://mbs.com.vn/media/ii2j0obt/báo-cáo-đầu-tư-hpg-full-04-04-22.pdf"
        page: ""
    note: >-
      OTHER (người gán đánh giá được ủng hộ): tồn kho tăng để đáp ứng nhu cầu thị trường tăng, tức là
      tăng theo quy mô sản xuất và kinh doanh. MBS: "trong giai đoạn này lượng hang tồn kho của HPG
      tăng khá cao đạt hơn 42 nghìn tỷ đồng (+60% YoY)" và mức tăng này "nhằm đáp ứng sự gia tăng nhu
      cầu từ thị trường". INV-3 (nhu cầu yếu) bị nguồn phản bác.

