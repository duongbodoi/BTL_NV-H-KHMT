      margin_inventory_cost_effect: PARTIAL
      margin_product_market_mix: PARTIAL
    sources:
      - title: "MBS – Báo cáo NKG"
        date: "2022-02-28"
        url: "https://mbs.com.vn/media/xionyyrt/nkg_28-02-2022.pdf"
        page: ""
      - title: "KBSV – Báo cáo lần đầu NKG"
        date: "2022-09-08"   # in dưới tiêu đề trang bìa ("Giá hiện tại (Sep 7)")
        url: "https://www.kbsec.com.vn/pic/Service/KBSV_NKG_Baocaolandau_20220809%20(2).pdf"
