      margin_product_market_mix: PARTIAL
    sources:
      - title: "Người Quan Sát – “Nối gót” Hòa Phát, Hoa Sen (HSG) báo lỗ khủng quý cuối niên độ 2021–2022"
        date: "2022-10-29"
        url: "https://nguoiquansat.vn/noi-got-hoa-phat-hoa-sen-hsg-bao-lo-khung-quy-cuoi-nien-do-2021-2022-68290.html"
        page: ""   # bài báo, không có trang
    note: >-
      GM-3: "lượng hàng tồn kho phục vụ cho hoạt động kinh doanh không thể giảm ngay lập tức". GM-1:
      "Giá thép giảm liên tục trong khi nhu cầu tiêu thụ chậm". GM-4: "chi phí dự phòng giảm giá hàng
      tồn kho lại tăng khủng tới 246% lên mức 716 tỷ đồng". GM-2: "giá đầu vào (chủ yếu từ nửa cuối
      năm ngoái) tăng cao". GM-5: "gây ảnh hưởng đến sản lượng xuất khẩu thép của Việt Nam".

