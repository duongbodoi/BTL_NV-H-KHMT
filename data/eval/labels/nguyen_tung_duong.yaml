    reference_set: [inventory_capacity_expansion, inventory_price_not_volume, inventory_goods_in_transit_timing]
    statuses:
      inventory_capacity_expansion: SUPPORTED
      inventory_price_not_volume: PARTIAL
      inventory_goods_in_transit_timing: PARTIAL
    sources:
