[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "steel-xai"
version = "0.0.0"
description = "Giải thích bất thường BCTC ngành thép bằng thư viện giả thuyết + RAG có trích dẫn + kiểm chứng bằng code"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Chỉ cần khi chạy LLM thật; test dùng transport giả nên không cần cài.
llm = [
    "anthropic>=1.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Prompt tiếng Việt dài một dòng có chủ đích (chuỗi được băm vào freeze, không ngắt tùy ý).
"src/steel_xai/llm/prompts.py" = ["E501"]
"src/steel_xai/eval/baselines.py" = ["E501"]
